name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Pipeline on sample data (ingest + dbt build and tests)
        run: uv run python flows/pipeline.py --sample
