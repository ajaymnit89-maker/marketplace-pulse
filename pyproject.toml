[project]
name = "marketplace-pulse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "dbt-core>=1.10,<1.12",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "statsforecast>=2.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.7",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# notebook cells end in a bare expression to display it
"analysis/*.py" = ["B018"]
