version: 2

models:
  - name: fct_orders
    description: >
      One row per order. Joins status, delivery timing, value, payment and the order's latest review.
      See the metrics doc for how to aggregate it. {{ doc('metrics') }}
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: The person who placed the order.
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_customer'), field: customer_unique_id}}
      - name: purchase_date
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: is_late
        description: Delivered after the promised date (calendar days). Null if not delivered.
      - name: delay_days
        description: Delivered date minus promised date. Negative = early.
      - name: order_value
        description: Item price + freight. Sum of this is GMV.
      - name: customer_order_number
        description: 1 for a person's first order, 2 for their second, and so on.
  - name: fct_order_items
    description: One row per item in an order, with seller, product and the order's delivery outcome.
    data_tests:
      - unique_combination: {arguments: {columns: [order_id, order_item_id]}}
    columns:
      - name: product_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_product'), field: product_id}}
      - name: seller_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_seller'), field: seller_id}}
      - name: seller_shipped_late
        description: Seller handed the parcel to the carrier after its shipping deadline.
  - name: dim_customer
    description: One row per person (customer_unique_id).
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
  - name: dim_seller
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]
